services:
  kizuna:
    image: blackstart-labs/kizuna:latest
    container_name: kizuna
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KIZUNA_PORT=8080
      - KIZUNA_HOST=0.0.0.0
      - KIZUNA_DB_PATH=/data/kizuna.db
      - KIZUNA_DEMO_MODE=false
      - KIZUNA_LOG_LEVEL=INFO
      - TZ=Asia/Dhaka
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    external: true

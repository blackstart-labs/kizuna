name: CI

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Test & Build (Go 1.23 + React 19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build Frontend SPA
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Go Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Verify Go Single-Binary Build
        run: go build -v -ldflags="-s -w -X main.Version=ci-test" -o bin/kizuna ./cmd/kizuna

  frontend-check:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install

      - name: Run Type Check & Build
        working-directory: web
        run: pnpm build

  docker-build-test:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: false
          tags: blackstart-labs/kizuna:test
